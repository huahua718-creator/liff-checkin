<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; text-align: center; color: #333; }
      label { font-weight: bold; display: block; margin-bottom: 8px; text-align: left; }
      select { width: 100%; padding: 10px; margin-bottom: 20px; border-radius: 6px; border: 1px solid #ccc; font-size: 15px; }
      .qr-container { background: #f8f9fa; border: 2px dashed #1DB446; padding: 20px; border-radius: 12px; display: inline-block; margin-bottom: 15px; }
      img { width: 220px; height: 220px; display: block; margin: 0 auto; }
      .code-hint { margin-top: 10px; font-weight: bold; color: #555; font-size: 14px; }
      .btn-download { background: #1DB446; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block; }
      .no-data { color: #dc3545; font-weight: bold; margin-top: 20px; }
    </style>
  </head>
  <body>

    <label for="meetingSelect">📌 選擇已啟用的開會場次：</label>

    <? if (meetings && meetings.length > 0) { ?>
      <select id="meetingSelect" onchange="renderQRCode()">
        <? for (var i = 0; i < meetings.length; i++) { ?>
          <option value="<?= meetings[i].passcode ?>">
            <?= meetings[i].name ?> (<?= meetings[i].passcode ?>)
          </option>
        <? } ?>
      </select>

      <div class="qr-container" id="qrBox">
        <img id="qrImage" src="" alt="會議驗證碼 QR Code">
        <div class="code-hint">驗證碼字串：<span id="codeText" style="color:#007bff;"></span></div>
      </div>

      <div id="actionBox" style="margin-top:10px;">
        <a id="downloadBtn" class="btn-download" target="_blank" download="QRCode.png">下載 / 放大圖片</a>
      </div>
    <? } else { ?>
      <div class="no-data">⚠ 目前「會議地點與時間設定」分頁中沒有「啟用」狀態的會議！</div>
    <? } ?>

    <script>
      window.onload = function() {
        renderQRCode();
      };

      function renderQRCode() {
        const select = document.getElementById('meetingSelect');
        if (!select) return;

        const passcode = select.value;
        if (!passcode) {
          alert('該會議尚未設定現場驗證碼 (Passcode)！');
          return;
        }

        // 產生 QR Code 圖片網址
        const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(passcode);
        
        document.getElementById('qrImage').src = qrUrl;
        document.getElementById('codeText').innerText = passcode;
        document.getElementById('downloadBtn').href = qrUrl;
      }
    </script>
  </body>
</html>
